scalar ShortId

type ErrorData {
  code: Int!
  message: String!
  errorKey: String
  timeout: Int
}

input RegisterUserRequest {
  name: String!
  email: String!
  password: String!
}

type User {
  id: ShortId!
  name: String!
  email: String!
}

type RegisterUserResponse {
  status: Int!
  error: ErrorData
  data: User
}
